name: Deploy landing page to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble allowlisted site files
        run: |
          set -euo pipefail
          mkdir -p site/css site/js \
            "site/Photos/TRX" \
            "site/Photos/Kettlebell" \
            "site/Photos/TRX Yoga" \
            "site/Photos/Others" \
            "site/Photos/Portrait"

          cp index.html site/
          cp css/camp.css site/css/
          cp js/signup.js js/signup-config.js site/js/
          cp "KiriFitnessLogo_20250401(whitebg).png" site/
          cp Photos/TRX/IMG_6899_pike.jpg "site/Photos/TRX/"
          cp Photos/Kettlebell/IMG_3122.png "site/Photos/Kettlebell/"
          cp "Photos/TRX Yoga/IMG_0281.jpg" "site/Photos/TRX Yoga/"
          cp Photos/Others/IMG_9802_fix.png "site/Photos/Others/"
          cp Photos/Portrait/IMG_6720.png "site/Photos/Portrait/"
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
